name: Verify main

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck-and-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: TypeScript typecheck
        run: npm run check:types
      - name: Unit tests
        run: npm test
