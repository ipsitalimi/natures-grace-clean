name: Quality checks

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run critical-path regression tests
        run: npm test

      - name: Typecheck application and tests
        run: npm run check:types

      - name: Lint
        run: npm run lint

      - name: Build API server
        run: npm run server:build

      - name: Build Expo web client
        run: npx expo export --platform web --output-dir web-build
